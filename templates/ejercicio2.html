<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <title>Formulario de Nombres</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}"/>
</head>
<body>
<div class="container">
    <h2>Formulario de Nombres</h2>
    <form method="POST" action="/ejercicio2" class="form-nombres">
        <div class="form-group">
            <label for="nombre1">Nombre 1:</label>
            <input type="text" name="nombre1" required>
        </div>
        <div class="form-group">
            <label for="nombre2">Nombre 2:</label>
            <input type="text" name="nombre2" required>
        </div>
        <div class="form-group">
            <label for="nombre3">Nombre 3:</label>
            <input type="text" name="nombre3" required>
        </div>
        <div class="form-group">
            <input type="submit" value="Enviar">
        </div>
    </form>

    {% if nombre_mayor is not none %}
        <div class="resultado">
            <p>El nombre con mayor cantidad de caracteres es: {{ nombre_mayor }}</p>
            <p>El nombre tiene: {{ cantidad }} caracteres</p>
        </div>
    {% endif %}

    <p><a href="/">Volver al menú principal</a></p>
</div>
</body>
</html>
