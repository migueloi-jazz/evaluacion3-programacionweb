<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <title>Ejercicio 1</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}"/>
</head>
<body>
<div class="container">
    <h2>Formulario de Notas</h2>
    <form method="POST" action="/ejercicio1" class="form-notas">
        <div class="form-group">
            <label for="nota1">Nota 1:</label>
            <input type="number" name="nota1" min="10" max="70" required>
        </div>
        <div class="form-group">
            <label for="nota2">Nota 2:</label>
            <input type="number" name="nota2" min="10" max="70" required>
        </div>
        <div class="form-group">
            <label for="nota3">Nota 3:</label>
            <input type="number" name="nota3" min="10" max="70" required>
        </div>
        <div class="form-group">
            <label for="asistencia">Asistencia (%):</label>
            <input type="number" name="asistencia" min="0" max="100" required>
        </div>
        <div class="form-group">
            <input type="submit" value="Enviar">
        </div>
    </form>

    {% if promedio is not none %}
        <div class="resultado">
            <p>Promedio de notas: {{ promedio }}</p>
            <p>Estado: {{ estado }}</p>
        </div>
    {% endif %}

    <p><a href="/">Volver al menú principal</a></p>
</div>
</body>
</html>
